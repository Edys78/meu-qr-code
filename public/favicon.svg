<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="110" fill="#070A14" />
  
  <!-- Outer glowing viewfinder corners -->
  <path d="M 140 100 L 100 100 A 30 30 0 0 0 70 130 L 70 170" fill="none" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 372 100 L 412 100 A 30 30 0 0 1 442 130 L 442 170" fill="none" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 70 230 L 70 270 A 30 30 0 0 0 100 300 L 140 300" fill="none" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 442 230 L 442 270 A 30 30 0 0 1 412 300 L 372 300" fill="none" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- QR Finder Patterns (Top-Left) -->
  <rect x="120" y="110" width="100" height="100" rx="20" fill="none" stroke="#FFFFFF" stroke-width="18" />
  <rect x="148" y="138" width="44" height="44" rx="8" fill="#FFFFFF" />

  <!-- QR Finder Patterns (Top-Right) -->
  <rect x="292" y="110" width="100" height="100" rx="20" fill="none" stroke="#FFFFFF" stroke-width="18" />
  <rect x="320" y="138" width="44" height="44" rx="8" fill="#FFFFFF" />

  <!-- Glowing Laser Scan Line -->
  <line x1="75" y1="200" x2="437" y2="200" stroke="#00F5D4" stroke-width="18" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- QR Finder Patterns (Bottom-Left) -->
  <rect x="120" y="215" width="100" height="100" rx="20" fill="none" stroke="#FFFFFF" stroke-width="18" />
  <rect x="148" y="243" width="44" height="44" rx="8" fill="#FFFFFF" />

  <!-- QR Modules Data (Bottom-Right) -->
  <rect x="292" y="215" width="42" height="42" rx="8" fill="#FFFFFF" />
  <rect x="350" y="215" width="42" height="42" rx="8" fill="#FFFFFF" />
  <rect x="292" y="273" width="42" height="42" rx="8" fill="#FFFFFF" />
  <rect x="350" y="273" width="42" height="42" rx="8" fill="#00F5D4" />

  <!-- Big Typography: QR-code -->
  <text x="75" y="405" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="112" fill="#FFFFFF" letter-spacing="-3">QR-</text>
  <text x="270" y="405" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="112" fill="url(#cyanGrad)" letter-spacing="-3">code</text>
</svg>
